<svg xmlns="http://www.w3.org/2000/svg" width="680" height="345" viewBox="0 0 680 345" role="img">
<title>Consolidation account behind one Tornado layer</title>
<desc>Three funding accounts deposit into Tornado; several withdrawals go to one consolidation account that earns yield and pays three spending accounts directly. The consolidation account and the spending accounts form a cluster linkable by address reuse.</desc>
<defs>
<marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="#5F5E5A" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker>
<style>
text { font-family: 'Source Sans 3','Helvetica Neue',Helvetica,Arial,sans-serif; }
.pt { font-size: 14px; font-weight: 600; fill: #3C3489; }
.ps { font-size: 12px; fill: #534AB7; }
.gt { font-size: 14px; font-weight: 600; fill: #444441; }
.gs { font-size: 12px; fill: #5F5E5A; }
.lg { font-size: 12px; fill: #5F5E5A; }
.cl { font-size: 12px; fill: #D85A30; }
.arr { stroke: #5F5E5A; stroke-width: 1.2; fill: none; }
</style>
</defs>
